name: manage_calendar_events
description: A flutter plugin which will help you to add, edit and remove the
  events (with reminders) from your (Android and ios) calendars
version: 2.1.1
homepage: https://github.com/lakshmanaprabhu/manage_calendar_events
repository: https://github.com/lakshmanaprabhu/manage_calendar_events
topics:
  - calendar
  - events
  - reminders

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The androidPackage and pluginClass identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.fantastic.manage_calendar_events
        pluginClass: ManageCalendarEventsPlugin
      ios:
        pluginClass: ManageCalendarEventsPlugin
